<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎵 イントロドン！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff9eb;
      --ink: #2a2438;
      --muted: #6e677d;
      --card: #ffffff;
      --accent: #ff4d79;
      --accent-dark: #c9184a;
      --mint: #16c79a;
      --mint-dark: #0e8f6d;
      --sky: #00b4d8;
      --sun: #ffbe0b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        radial-gradient(#ffd6e0 2px, transparent 2px),
        radial-gradient(#c8ecff 2px, transparent 2px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      touch-action: manipulation;
      user-select: none;
    }
    .screen { display: none; min-height: 100dvh; padding: 14px; max-width: 600px; margin: 0 auto; }
    .screen.active { display: flex; flex-direction: column; }
    h1, h2, h3 { margin: 0 0 10px; font-weight: 900; letter-spacing: 0.02em; }
    .logo-title {
      font-size: 30px; line-height: 1.2; margin-bottom: 8px;
      background: linear-gradient(135deg, #ff4d79 0%, #ff9f1c 50%, #00b4d8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 rgba(42,36,56,0.12));
    }
    .card {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 5px 0 rgba(42,36,56,0.15);
    }
    button {
      font-family: inherit;
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: var(--ink);
      background: #f3f0fa;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.06s, box-shadow 0.06s, opacity 0.12s;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    button:disabled { opacity: 0.45; pointer-events: none; }
    .btn-pop { background: var(--mint); color: #fff; text-shadow: 0 1.5px 0 rgba(0,0,0,0.2); }
    .btn-pink { background: var(--accent); color: #fff; text-shadow: 0 1.5px 0 rgba(0,0,0,0.2); }
    .btn-sky { background: var(--sky); color: #fff; text-shadow: 0 1.5px 0 rgba(0,0,0,0.2); }
    .btn-sun { background: var(--sun); color: var(--ink); }
    .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 12px; border-width: 2.5px; box-shadow: 0 3px 0 var(--ink); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="text"], select {
      font-family: inherit; font-weight: 700;
      background: #fffdf7; color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 14px;
      padding: 10px 12px; font-size: 14px; width: 100%;
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .tab-btn { background: #fff; color: var(--muted); padding: 10px 8px; font-size: 14px; }
    .tab-btn.active { background: var(--sun); color: var(--ink); }
    .list-box { max-height: 205px; overflow-y: auto; margin-top: 8px; }
    .track-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 4px;
      border-bottom: 2px dashed #ece6f5; font-size: 14px;
    }
    .track-item img {
      width: 42px; height: 42px; border-radius: 10px; object-fit: cover;
      border: 2px solid var(--ink); background: #eee;
    }
    .track-meta { flex: 1; min-width: 0; }
    .track-title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      display: inline-block; background: var(--sun); color: var(--ink);
      border: 2px solid var(--ink); padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 900;
    }
    .selected-box {
      background: #e6fff7; border: 2.5px solid var(--mint-dark); border-radius: 16px;
      padding: 10px 12px; margin-top: 10px; display: flex; align-items: center; gap: 10px;
    }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.5; font-weight: 700; }

    /* ゲーム画面 */
    #screen-game { padding: 10px; justify-content: space-between; gap: 10px; }
    .buzzer-row { display: grid; gap: 10px; flex: 1; }
    .buzzer-row.cols-1 { grid-template-columns: 1fr; }
    .buzzer-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .buzzer-btn {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border: 3.5px solid var(--ink); border-radius: 24px; min-height: 118px;
      font-size: 21px; font-weight: 900; color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.22);
      box-shadow: 0 7px 0 var(--ink);
      touch-action: none;
    }
    .buzzer-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
    .buzzer-btn.rotated { transform: rotate(180deg); }
    .buzzer-btn.rotated:active { transform: rotate(180deg) translateY(5px); box-shadow: 0 2px 0 var(--ink); }
    .buzzer-btn.locked { opacity: 0.3; filter: grayscale(0.85); }
    .buzzer-score {
      margin-top: 6px; font-size: 14px; font-weight: 900;
      background: rgba(255,255,255,0.25); padding: 2px 12px; border-radius: 999px;
    }
    .center-panel {
      background: #ffffff; border: 3.5px solid var(--ink); border-radius: 24px;
      padding: 12px 14px; text-align: center;
      box-shadow: 0 6px 0 rgba(42,36,56,0.16);
    }
    .status-text { font-size: 16px; font-weight: 900; margin: 4px 0; color: var(--ink); }
    .cooldown-num {
      font-size: 34px; font-weight: 900; color: var(--accent);
      line-height: 1.1; margin: 2px 0;
    }
    .timer-wrap {
      background: #f8f5ff; border: 2.5px solid var(--ink); border-radius: 16px;
      padding: 8px 12px; margin: 6px 0;
    }
    .timer-bar {
      display: flex; justify-content: center; align-items: baseline; gap: 14px;
      font-variant-numeric: tabular-nums;
    }
    .timer-sec { font-size: 22px; font-weight: 900; color: var(--ink); }
    .timer-pts { font-size: 20px; font-weight: 900; color: var(--accent); }
    .gauge-track {
      height: 10px; background: #e6e0f0; border: 2px solid var(--ink);
      border-radius: 999px; overflow: hidden; margin-top: 6px;
    }
    .gauge-fill {
      height: 100%; width: 100%; background: var(--mint);
      border-radius: 999px; transition: background-color 0.2s;
    }

    /* モーダル */
    @keyframes popIn {
      0% { transform: scale(0.82); opacity: 0; }
      75% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal {
      position: fixed; inset: 0; background: rgba(42,36,56,0.72); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: #ffffff; border: 4px solid var(--ink); border-radius: 26px;
      padding: 20px 18px; width: 100%; max-width: 480px; text-align: center;
      box-shadow: 0 10px 0 rgba(42,36,56,0.28);
      animation: popIn 0.22s ease-out;
    }
    .choice-btn {
      width: 100%; text-align: left; margin-bottom: 10px; background: #fffdf7;
      padding: 11px 12px; line-height: 1.3; display: flex; align-items: center; gap: 10px;
    }
    .choice-letter {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
      border: 2px solid var(--ink); color: #fff; font-weight: 900; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .choice-sub { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
    .album-art {
      width: 148px; height: 148px; border-radius: 18px; object-fit: cover;
      margin: 10px auto; display: block; border: 3px solid var(--ink); background: #eee;
      box-shadow: 0 5px 0 rgba(42,36,56,0.18);
    }
    .speed-badge {
      display: inline-block; background: #fff4cc; border: 2.5px solid var(--ink);
      color: var(--ink); border-radius: 999px; padding: 4px 14px;
      font-size: 13px; font-weight: 900; margin-bottom: 10px;
    }
    .rank-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px; margin-bottom: 8px; border-radius: 16px;
      background: #fffdf7; border: 3px solid var(--ink); font-weight: 900;
    }
  </style>
</head>
<body>

<!-- 1. ログイン画面 -->
<section id="screen-login" class="screen active" style="justify-content:center; text-align:center;">
  <div class="card" style="padding:28px 20px;">
    <div style="font-size:44px; margin-bottom:4px;">🎵✨</div>
    <h1 class="logo-title">Spotify イントロドン！</h1>
    <p class="hint" style="margin-bottom:18px;">
      Android 1台でワイワイ早押しバトル！<br>
      スピード得点制・低遅延チューニング・曲数無制限
    </p>

    <div id="client-id-box" style="text-align:left; margin-bottom:14px;">
      <label class="hint" style="display:block; margin-bottom:4px;">
        🔑 Spotify Client ID（一度入力すれば記憶されます）
      </label>
      <input type="text" id="client-id-input" placeholder="Spotify DeveloperのClient IDを貼り付け" />
    </div>

    <button class="btn-pop" style="width:100%; font-size:18px; padding:14px;" onclick="loginSpotify()">
      ▶ Spotify でログイン
    </button>
    <p id="login-error" class="hint" style="color:var(--accent-dark); margin-top:12px;"></p>
  </div>
</section>

<!-- 2. セットアップ画面 -->
<section id="screen-setup" class="screen">
  <div class="row" style="justify-content:space-between; margin-bottom:10px;">
    <h2 style="margin:0; font-size:22px;">🎉 クイズ準備</h2>
    <button class="btn-sm" onclick="logoutSpotify()">ログアウト</button>
  </div>

  <!-- 出題ソース切替タブ -->
  <div class="tabs">
    <button id="tab-direct" class="tab-btn active" onclick="switchSourceTab('direct')">
      🌍 プレイリスト直再生<br><span style="font-size:11px;">他人・公式OK / 無制限</span>
    </button>
    <button id="tab-custom" class="tab-btn" onclick="switchSourceTab('custom')">
      📝 曲リストを自作<br><span style="font-size:11px;">自分の曲・全曲読込</span>
    </button>
  </div>

  <!-- モードA：プレイリスト直再生 -->
  <div id="panel-direct">
    <div class="card">
      <h3>🎧 プレイリストを選ぶ</h3>

      <label class="hint">① ライブラリ（フォロー中の他人・公式含む）</label>
      <div class="row" style="margin:4px 0 12px;">
        <select id="direct-playlist-select" style="flex:1;" onchange="onDirectSelectChange()"></select>
      </div>

      <label class="hint">② Spotify上のプレイリストを検索</label>
      <div class="row" style="margin:4px 0 6px;">
        <input type="text" id="pl-search-input" placeholder="例：平成ヒット、アニソン、J-POP..." style="flex:1;" />
        <button class="btn-sky btn-sm" onclick="searchPlaylists()">検索</button>
      </div>
      <div id="pl-search-results" class="list-box"></div>

      <label class="hint" style="display:block; margin-top:10px;">③ Spotifyの共有リンク（URL）を貼る</label>
      <div class="row" style="margin-top:4px;">
        <input type="text" id="pl-url-input" placeholder="https://open.spotify.com/playlist/..." style="flex:1;" />
        <button class="btn-sun btn-sm" onclick="loadPlaylistByUrl()">設定</button>
      </div>

      <div id="direct-selected-view" class="selected-box" style="display:none;">
        <div style="font-size:24px;">✅</div>
        <div class="track-meta">
          <div style="font-size:11px; color:var(--mint-dark); font-weight:900;">選択中のプレイリスト</div>
          <div id="direct-selected-name" class="track-title"></div>
          <div id="direct-selected-sub" class="track-artist"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- モードB：カスタム曲リスト -->
  <div id="panel-custom" style="display:none;">
    <div class="card">
      <h3>1. 曲を追加する（曲数無制限）</h3>
      <div class="row" style="margin-bottom:8px;">
        <select id="custom-playlist-select" style="flex:1;"></select>
        <button id="btn-load-all" class="btn-pop btn-sm" onclick="loadSelectedPlaylistAll()">全曲読込</button>
        <button id="btn-cancel-load" class="btn-pink btn-sm" style="display:none;" onclick="cancelLoading()">停止</button>
      </div>
      <div id="load-progress" class="hint" style="color:var(--mint-dark); margin-bottom:6px;"></div>

      <div class="row">
        <input type="text" id="search-input" placeholder="曲名・アーティスト名で検索..." style="flex:1;" />
        <button class="btn-sky btn-sm" onclick="searchTracks()">検索</button>
      </div>
      <div id="search-results" class="list-box"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h3 style="margin:0;">2. 出題リスト <span id="pool-count" class="badge">0曲</span></h3>
        <button class="btn-pink btn-sm" onclick="clearPool()">全削除</button>
      </div>
      <div id="pool-list" class="list-box"></div>
    </div>
  </div>

  <!-- 対戦ルール -->
  <div class="card">
    <h3>⚡ 対戦ルール</h3>
    <div class="row" style="margin-bottom:8px;">
      <label style="flex:1;">
        <span class="hint">プレイヤー人数</span>
        <select id="opt-players">
          <option value="2" selected>2人（対面）</option>
          <option value="3">3人（対面）</option>
          <option value="4">4人（対面）</option>
          <option value="1">1人（練習）</option>
        </select>
      </label>
      <label style="flex:1;">
        <span class="hint">正誤判定</span>
        <select id="opt-mode">
          <option value="choice" selected>4択クイズ</option>
          <option value="text">曲名入力</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <label style="flex:1;">
        <span class="hint">得点方式</span>
        <select id="opt-scoring">
          <option value="speed" selected>スピード制（100〜20点）</option>
          <option value="fixed">シンプル（1問 1点）</option>
        </select>
      </label>
      <label style="flex:1;">
        <span class="hint">出題数</span>
        <select id="opt-rounds">
          <option value="INF" selected>無制限（終了まで）</option>
          <option value="ALL">リストの全曲</option>
          <option value="5">5問</option>
          <option value="10">10問</option>
          <option value="20">20問</option>
        </select>
      </label>
    </div>
    <label>
      <span class="hint">⚡ ラグ補正（音が遅れて鳴る場合は大きめに）</span>
      <select id="opt-lead">
        <option value="400">0.4秒先打ち（高速Wi-Fi向け）</option>
        <option value="650" selected>0.65秒先打ち（標準・おすすめ）</option>
        <option value="900">0.9秒先打ち（少し遅れるとき）</option>
        <option value="1200">1.2秒先打ち（かなり遅れるとき）</option>
      </select>
    </label>
  </div>

  <button class="btn-pink" style="width:100%; padding:16px; font-size:20px;" onclick="startGame()">
    🚀 対戦画面へすすむ！
  </button>
  <p class="hint" style="text-align:center; margin-top:8px;">
    ※開始前にSpotifyアプリで1秒だけ再生→停止しておくとスムーズです。
  </p>
</section>

<!-- 3. ゲーム画面 -->
<section id="screen-game" class="screen">
  <div id="top-buzzers" class="buzzer-row"></div>

  <div class="center-panel">
    <div class="row" style="justify-content:space-between; margin-bottom:2px;">
      <span id="round-label" class="badge">第 1 問</span>
      <button class="btn-sm" onclick="finishOrAbortGame()">結果を見て終了</button>
    </div>

    <div class="timer-wrap">
      <div class="timer-bar">
        <span id="timer-sec" class="timer-sec">⏱ 0.00 秒</span>
        <span id="timer-pts" class="timer-pts">+100 点</span>
      </div>
      <div class="gauge-track">
        <div id="timer-gauge" class="gauge-fill"></div>
      </div>
    </div>

    <div id="cooldown-display" class="cooldown-num" style="display:none;">3</div>
    <div id="game-status" class="status-text">準備ができたらスタートを押してください</div>
    <div class="row" style="justify-content:center; margin-top:8px;">
      <button id="btn-play" class="btn-pop" style="padding:12px 24px; font-size:17px;" onclick="playCurrentQuestion()">▶ 第1問をスタート！</button>
      <button id="btn-giveup" class="btn-sun btn-sm" onclick="giveUpQuestion()" disabled>パス / 正解を見る</button>
    </div>
  </div>

  <div id="bottom-buzzers" class="buzzer-row"></div>
</section>

<!-- 4. 最終結果画面 -->
<section id="screen-finish" class="screen" style="justify-content:center; text-align:center;">
  <div class="card" style="padding:24px 18px;">
    <div style="font-size:44px; margin-bottom:4px;">🏆🎉</div>
    <h1 class="logo-title" style="font-size:28px;">結果発表！</h1>
    <div id="final-ranking" style="margin:16px 0; text-align:left;"></div>
    <div class="row" style="justify-content:center; gap:10px;">
      <button class="btn-pink" onclick="startGame()">もう一回遊ぶ！</button>
      <button class="btn-sun" onclick="showScreen('setup')">曲選びに戻る</button>
    </div>
  </div>
</section>

<!-- 回答モーダル -->
<div id="modal-answer" class="modal">
  <div class="modal-card">
    <h2 id="ans-player-title" style="font-size:22px;">回答権！</h2>
    <div id="ans-time-badge" class="speed-badge">⏱ 0.00秒（正解で +100点）</div>
    <div id="ans-choice-area"></div>
    <div id="ans-text-area" style="display:none;">
      <input type="text" id="ans-text-input" placeholder="曲名を入力（ひらがな・英語OK）" autocomplete="off" />
      <button id="btn-text-submit" class="btn-pop" style="width:100%; margin-top:10px;" onclick="submitTextAnswer()">回答する！</button>
    </div>
  </div>
</div>

<!-- 正解発表モーダル -->
<div id="modal-reveal" class="modal">
  <div class="modal-card">
    <h2 id="reveal-heading" style="font-size:22px;">⭕ 正解！</h2>
    <div id="reveal-speed-badge" class="speed-badge" style="display:none;"></div>
    <img id="reveal-img" class="album-art" src="" alt="" />
    <div id="reveal-title" style="font-size:20px; font-weight:900;"></div>
    <div id="reveal-artist" class="hint" style="font-size:14px; margin-bottom:14px;"></div>
    <button id="btn-next-round" class="btn-pink" style="width:100%; font-size:17px;" onclick="nextRound()">次の問題へ（3秒後に自動開始）➔</button>
  </div>
</div>

<script>
  const DEFAULT_CLIENT_ID = "f3db95d96e6c4eb4b8b2c570b1311828";

  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = [
    "user-read-playback-state",
    "user-read-currently-playing",
    "user-modify-playback-state",
    "playlist-read-private",
    "playlist-read-collaborative",
    "user-library-read"
  ].join(" ");

  const PLAYER_COLORS = ["#ff4d79", "#00b4d8", "#2ec4b6", "#ff9f1c"];
  const PLAYER_NAMES = ["🍓 P1", "🐬 P2", "🍈 P3", "🍊 P4"];
  const CHOICE_LETTERS = ["A", "B", "C", "D"];
  const CHOICE_COLORS = ["#ff4d79", "#00b4d8", "#2ec4b6", "#ff9f1c"];

  let myUserId = "";
  let cachedDeviceId = null;
  let sourceMode = "direct";
  let libraryPlaylists = [];
  let selectedDirectPlaylist = null;
  let quizPool = [];
  let isLoadingPool = false;
  let cancelLoadFlag = false;
  let game = null;
  let audioCtx = null;
  let timerRafId = null;
  let buzzAudio = null; // OSのオーディオフォーカスを奪ってSpotifyを即停止させる専用Audio

  function getClientId() {
    if (DEFAULT_CLIENT_ID && DEFAULT_CLIENT_ID !== "YOUR_SPOTIFY_CLIENT_ID") {
      return DEFAULT_CLIENT_ID.trim();
    }
    const inputEl = document.getElementById("client-id-input");
    const typed = inputEl ? inputEl.value.trim() : "";
    if (typed) {
      localStorage.setItem("sp_saved_client_id", typed);
      return typed;
    }
    return (localStorage.getItem("sp_saved_client_id") || "").trim();
  }

  // ---------- 即時停止用ブザーWAV（HTML Audio生成）＆効果音 ----------
  function createBuzzAudioElement() {
    try {
      const sampleRate = 22050;
      const duration = 6.0;
      const numSamples = Math.floor(sampleRate * duration);
      const dataSize = numSamples * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);

        for (let i = 0; i < numSamples; i++) {
    const t = i / sampleRate  
      let sample = 0;
      if (t < 0.24) {
          const freq = t < 0.09 ? 880 : 1174.66;
          const localT = t < 0.09 ? t : (t - 0.09);
          const env = Math.exp(-localT * 10);
          sample = Math.sin(2 * Math.PI * freq * t) * 0.55 * env;
        }
        view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.round(sample * 32767))), true);
      }


      const blob = new Blob([buffer], { type: "audio/wav" });
      const audio = new Audio(URL.createObjectURL(blob));
      audio.preload = "auto";
      return audio;
    } catch (e) {
      return null;
    }
  }

  function unlockAudioAll() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
    if (!buzzAudio) buzzAudio = createBuzzAudioElement();
    if (buzzAudio && !buzzAudio._unlocked) {
      buzzAudio.muted = true;
      const p = buzzAudio.play();
      if (p && p.then) {
        p.then(() => {
          buzzAudio.pause();
          buzzAudio.currentTime = 0;
          buzzAudio.muted = false;
          buzzAudio._unlocked = true;
        }).catch(() => { buzzAudio.muted = false; });
      }
    }
  }

  // 早押し専用：HTML Audio再生でAndroidのオーディオフォーカスを即座にChromeへ奪う
  function triggerInstantBuzzSound() {
    if (buzzAudio) {
      try {
        buzzAudio.muted = false;
        buzzAudio.currentTime = 0;
        const p = buzzAudio.play();
        if (p && p.catch) p.catch(() => playTone("buzz"));
        return;
      } catch (e) {}
    }
    playTone("buzz");
  }

  function stopBuzzAudio() {
    if (buzzAudio) {
      try {
        buzzAudio.pause();
        buzzAudio.currentTime = 0;
      } catch (e) {}
    }
  }

  function playTone(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const beep = (freq, start, dur, wave = "sine", vol = 0.24) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur);
      };
      if (type === "tick") beep(660, now, 0.08, "sine", 0.12);
      if (type === "buzz") { beep(880, now, 0.1, "triangle"); beep(1174, now + 0.08, 0.12, "triangle"); }
      if (type === "correct") { beep(1046, now, 0.12); beep(1318, now + 0.11, 0.12); beep(1568, now + 0.22, 0.3); }
      if (type === "wrong") { beep(200, now, 0.16, "sawtooth"); beep(155, now + 0.18, 0.28, "sawtooth"); }
    } catch (e) {}
  }

  // ---------- 秒数→点数 & ゲージ（指数減衰・最低20点） ----------
  function calcPointsForElapsed(ms, scoringMode) {
    if (scoringMode === "fixed") return 1;
    const sec = Math.max(0, ms / 1000);
    return Math.max(20, Math.round(20 + 80 * Math.exp(-0.35 * sec)));
  }

  function getElapsedMs() {
    if (!game) return 0;
    if (game.state === "PLAYING" && game.playingSince !== null) {
      return Math.max(0, game.elapsedMs + (Date.now() - game.playingSince));
    }
    return Math.max(0, game.elapsedMs);
  }

  function updateTimerDisplay() {
    if (!game) return;
    const ms = getElapsedMs();
    const secStr = (ms / 1000).toFixed(2);
    const pts = calcPointsForElapsed(ms, game.scoringMode);
    document.getElementById("timer-sec").textContent = `⏱ ${secStr} 秒`;
    document.getElementById("timer-pts").textContent =
      game.scoringMode === "speed" ? `+${pts} 点` : `+1 点`;

    const gauge = document.getElementById("timer-gauge");
    if (game.scoringMode === "speed") {
      const pct = Math.max(6, Math.round(((pts - 20) / 80) * 100));
      gauge.style.width = `${pct}%`;
      gauge.style.backgroundColor = pts >= 70 ? "#16c79a" : (pts >= 40 ? "#ffbe0b" : "#ff4d79");
    } else {
      gauge.style.width = "100%";
      gauge.style.backgroundColor = "#00b4d8";
    }
  }

  function startTimerLoop() {
    stopTimerLoop();
    const tick = () => {
      updateTimerDisplay();
      if (game && game.state === "PLAYING") timerRafId = requestAnimationFrame(tick);
    };
    timerRafId = requestAnimationFrame(tick);
  }

  function stopTimerLoop() {
    if (timerRafId !== null) {
      cancelAnimationFrame(timerRafId);
      timerRafId = null;
    }
  }

  // ---------- PKCE 認証 ----------
  function generateRandomString(len) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const vals = crypto.getRandomValues(new Uint8Array(len));
    return Array.from(vals, v => chars[v % chars.length]).join("");
  }
  async function sha256(plain) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(plain));
  }
  function base64url(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
  }

  async function loginSpotify() {
    const cid = getClientId();
    if (!cid) {
      document.getElementById("login-error").textContent = "上の入力欄に Spotify Client ID を貼り付けてからログインを押してください。";
      return;
    }
    const verifier = generateRandomString(64);
    const challenge = base64url(await sha256(verifier));
    localStorage.setItem("sp_code_verifier", verifier);
    const params = new URLSearchParams({
      client_id: cid,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: "S256",
      code_challenge: challenge
    });
    window.location.href = `https://accounts.spotify.com/authorize?${params}`;
  }

  async function exchangeToken(code) {
    const cid = getClientId();
    const verifier = localStorage.getItem("sp_code_verifier");
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: cid,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || "認証に失敗しました");
    saveTokens(data);
    history.replaceState({}, "", REDIRECT_URI);
  }

  async function refreshAccessToken() {
    const cid = getClientId();
    const refresh = localStorage.getItem("sp_refresh_token");
    if (!refresh || !cid) return false;
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: cid,
        grant_type: "refresh_token",
        refresh_token: refresh
      })
    });
    if (!res.ok) return false;
    saveTokens(await res.json());
    return true;
  }

  function saveTokens(data) {
    localStorage.setItem("sp_access_token", data.access_token);
    if (data.refresh_token) localStorage.setItem("sp_refresh_token", data.refresh_token);
    localStorage.setItem("sp_expires_at", String(Date.now() + (data.expires_in - 60) * 1000));
  }

  function logoutSpotify() {
    cachedDeviceId = null;
    localStorage.removeItem("sp_access_token");
    localStorage.removeItem("sp_refresh_token");
    localStorage.removeItem("sp_expires_at");
    showScreen("login");
  }

  async function spotifyFetch(pathOrUrl, options = {}) {
    const exp = Number(localStorage.getItem("sp_expires_at") || 0);
    if (Date.now() > exp) {
      const ok = await refreshAccessToken();
      if (!ok) { logoutSpotify(); throw new Error("再ログインが必要です"); }
    }
    const token = localStorage.getItem("sp_access_token");
    const url = pathOrUrl.startsWith("http") ? pathOrUrl : `https://api.spotify.com/v1${pathOrUrl}`;
    const res = await fetch(url, {
      cache: "no-store",
      ...options,
      headers: {
        Authorization: `Bearer ${token}`,
        ...(options.body ? { "Content-Type": "application/json" } : {}),
        ...(options.headers || {})
      }
    });
    if (res.status === 204) return null;
    if (res.status === 401) {
      const ok = await refreshAccessToken();
      if (ok) return spotifyFetch(pathOrUrl, options);
      logoutSpotify();
      throw new Error("認証が切れました");
    }
    if (res.status === 429) {
      const retry = Number(res.headers.get("Retry-After") || 2);
      await sleep(retry * 1000);
      return spotifyFetch(pathOrUrl, options);
    }
    const text = await res.text();
    let json = null;
    if (text) {
      try {
        json = JSON.parse(text);
      } catch (e) {
        json = null;
      }
    }
    if (!res.ok) {
      const err = new Error(json?.error?.message || text || `API Error ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return json;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function setupUserData() {
    const me = await spotifyFetch("/me");
    myUserId = me.id;
    refreshDeviceId().catch(() => {});

    libraryPlaylists = [];
    let nextUrl = "/me/playlists?limit=50";
    let guard = 0;
    while (nextUrl && guard < 10) {
      const plData = await spotifyFetch(nextUrl);
      (plData.items || []).filter(p => p && p.id && p.uri).forEach(p => {
        libraryPlaylists.push({
          id: p.id,
          uri: p.uri,
          name: p.name,
          owner: p.owner?.display_name || p.owner?.id || "Spotify",
          isOwn: p.owner?.id === myUserId || p.collaborative,
          total: p.items?.total ?? p.tracks?.total ?? 0
        });
      });
      nextUrl = plData.next;
      guard++;
    }

    const directSel = document.getElementById("direct-playlist-select");
    directSel.innerHTML = `<option value="">-- ライブラリから選択 --</option>`;
    libraryPlaylists.forEach((p, idx) => {
      const opt = document.createElement("option");
      opt.value = String(idx);
      const tag = p.isOwn ? "自分" : p.owner;
      opt.textContent = `${p.name} [${tag}]${p.total ? ` (${p.total}曲)` : ""}`;
      directSel.appendChild(opt);
    });

    const customSel = document.getElementById("custom-playlist-select");
    customSel.innerHTML = `<option value="__LIKED__">❤️ お気に入りの曲（全曲）</option>`;
    libraryPlaylists.filter(p => p.isOwn).forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name}${p.total ? ` (${p.total}曲)` : ""}`;

    const raw = document.getElementById("pl-url-input").value.trim();
    if (!raw) return;
    const m = raw.match(/playlist[/:]([A-Za-z0-9]+)/);
    const id = m ? m[1] : (/^[A-Za-z0-9]{15,30}$/.test(raw) ? raw : null);
    if (!id) {
      alert("SpotifyのプレイリストURL（https://open.spotify.com/playlist/...）を貼り付けてください。");
      return;
    }
    let name = "URL指定プレイリスト";
    let owner = "Spotify";
    let total = 0;
    try {
      const info = await spotifyFetch(`/playlists/${id}?fields=name,owner(display_name),items(total),tracks(total)`);
      if (info?.name) name = info.name;
      if (info?.owner?.display_name) owner = info.owner.display_name;
      total = info?.items?.total ?? info?.tracks?.total ?? 0;
    } catch (e) {}
    setSelectedDirectPlaylist({ id, uri: `spotify:playlist:${id}`, name, owner, total });

  // ---------- モードB：カスタム曲リスト ----------
  function toTrackObj(t) {
    if (!t || t.type !== "track" || !t.uri) return null;
    return {
      id: t.id,
      uri: t.uri,
      name: t.name,
      artist: (t.artists || []).map(a => a.name).join(", "),
      firstArtist: t.artists?.[0]?.name || "",
      image: t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || "",
      enabled: true
    };
  }

  function cancelLoading() { cancelLoadFlag = true; }

  async function loadSelectedPlaylistAll() {
    if (isLoadingPool) return;
    const val = document.getElementById("custom-playlist-select").value;
    isLoadingPool = true;
    cancelLoadFlag = false;
    document.getElementById("btn-load-all").disabled = true;
    document.getElementById("btn-cancel-load").style.display = "inline-block";
    const prog = document.getElementById("load-progress");

    let nextUrl = val === "__LIKED__" ? "/me/tracks?limit=50" : `/playlists/${val}/items?limit=100`;
    let added = 0;
    let scanned = 0;
    const existingIds = new Set(quizPool.map(t => t.id));

    try {
      while (nextUrl && !cancelLoadFlag) {
        const data = await spotifyFetch(nextUrl);
        (data.items || []).forEach(row => {
          scanned++;
          const t = toTrackObj(row.item || row.track);
          if (t && !existingIds.has(t.id)) {
            quizPool.push(t);
            existingIds.add(t.id);
            added++;
          }
        });
        prog.textContent = `読み込み中... ${scanned}曲確認（新規 +${added}曲）`;
        renderPool();
        nextUrl = data.next;
        if (nextUrl) await sleep(120);
      }
      prog.textContent = cancelLoadFlag
        ? `途中で停止しました（+${added}曲追加・合計${quizPool.length}曲）`
        : `完了！ +${added}曲追加（合計${quizPool.length}曲）`;
    } catch (e) {
      prog.textContent = "";
      alert("読み込みエラー: " + e.message);
    } finally {
      isLoadingPool = false;
      document.getElementById("btn-load-all").disabled = false;
      document.getElementById("btn-cancel-load").style.display = "none";
    }
  }

  function renderPool() {

    const list = document.getElementById("pool-list");

  // ---------- 低遅延 Spotify 再生コントロール ----------
  async function refreshDeviceId() {
    const data = await spotifyFetch("/me/player/devices");
    const devices = data?.devices || [];
    const pick =
      devices.find(d => d.is_active && d.type === "Smartphone") ||
      devices.find(d => d.type === "Smartphone") ||
      devices.find(d => d.is_active) ||
      devices[0];
    cachedDeviceId = pick ? pick.id : null;
    return cachedDeviceId;
  }

  async function requireDeviceId() {
    if (cachedDeviceId) return cachedDeviceId;
    const id = await refreshDeviceId();
    if (!id) {
      throw new Error("再生デバイスが見つかりません。一度Spotifyアプリを開き、適当な曲を1秒再生→停止してからもう一度押してください。");
    }
    return id;
  }

  async function withDeviceRetry(fn) {
    const id = await requireDeviceId();
    try {
      return await fn(id);
    } catch (e) {
      if (e.status === 404 || /device/i.test(e.message || "")) {
        cachedDeviceId = null;
        const freshId = await requireDeviceId();
        return await fn(freshId);
      }
      throw e;
    }
  }

  async function getPlaybackSnapshot() {
    try {
      const st = await spotifyFetch("/me/player");
      if (!st) return null;
      const track = toTrackObj(st.item);
      return {
        track,
        trackId: track?.id || null,
        contextUri: st.context?.uri || "",
        isPlaying: Boolean(st.is_playing),
        progressMs: typeof st.progress_ms === "number" ? st.progress_ms : 0
      };
    } catch (e) {
      return null;
    }
  }

  async function playTrackFromZero(uri) {
    stopBuzzAudio();
    await withDeviceRetry(id =>
      spotifyFetch(`/me/player/play?device_id=${encodeURIComponent(id)}`, {
        method: "PUT",
        priority: "high",
        body: JSON.stringify({ uris: [uri], position_ms: 0 })
      })
    );
  }

  async function triggerDirectPlaylistStart(playlist) {
    stopBuzzAudio();
    await withDeviceRetry(async id => {
      await spotifyFetch(`/me/player/shuffle?state=true&device_id=${encodeURIComponent(id)}`, { method: "PUT" }).catch(() => {});
      await sleep(160);
      await spotifyFetch(`/me/player/play?device_id=${encodeURIComponent(id)}`, {
        method: "PUT",
        priority: "high",
        body: JSON.stringify({ context_uri: playlist.uri, position_ms: 0 })
      });
    });
  }

  async function triggerDirectPlaylistNext() {
    stopBuzzAudio();
    await withDeviceRetry(id =>
      spotifyFetch(`/me/player/next?device_id=${encodeURIComponent(id)}`, { method: "POST", priority: "high" })
    );
  }

  async function waitForTrackSwitch({ beforeTrackId, beforeContextUri, targetPlaylistId, isNext, roundToken }) {
    const wasSamePlaylist = Boolean(targetPlaylistId && beforeContextUri && beforeContextUri.includes(targetPlaylistId));
    let nudgedPlay = false;
    let nudgedNext = false;

    await sleep(420);
    for (let i = 0; i < 20; i++) {
      if (!game || game.roundToken !== roundToken) return null;
      const snap = await getPlaybackSnapshot();

      if (snap && snap.track) {
        const trackChanged = Boolean(beforeTrackId) ? (snap.trackId !== beforeTrackId) : true;

        if (isNext) {
          if (trackChanged) {
            if (!snap.isPlaying && !nudgedPlay) {
              nudgedPlay = true;
              await resumePlaybackFast();
              await sleep(250);
              const fresh = await getPlaybackSnapshot();
              return fresh?.track ? fresh : snap;
            }
            return snap;
          }
          if (i === 5 && !nudgedNext) {
            nudgedNext = true;
            await triggerDirectPlaylistNext().catch(() => {});
          }
        } else {
          const inTarget = Boolean(targetPlaylistId && snap.contextUri && snap.contextUri.includes(targetPlaylistId));
          if (!wasSamePlaylist) {
            if (inTarget && snap.isPlaying && (trackChanged || snap.progressMs < 6000)) {
              return snap;
            }
            if (i >= 5 && trackChanged && snap.isPlaying && snap.progressMs < 8000) {
              return snap;
            }
          } else {
            if (trackChanged && snap.isPlaying) return snap;
            if (i === 4 && !trackChanged && !nudgedNext) {
              nudgedNext = true;
              await triggerDirectPlaylistNext().catch(() => {});
            }
          }
          if (!snap.isPlaying && i === 4 && !nudgedPlay) {
            nudgedPlay = true;
            await resumePlaybackFast();
          }
        }
      }
      await sleep(260);
    }

    throw new Error("Spotifyの曲切り替えを確認できませんでした。Spotifyアプリが起動しているか確認して、もう一度スタートを押してください。");
  }

  // ゼロオーバーヘッド最速一時停止（同期的に即fetch発射）
  function pausePlaybackFast() {
    const token = localStorage.getItem("sp_access_token");
    if (!token) return;
    const qs = cachedDeviceId ? `?device_id=${encodeURIComponent(cachedDeviceId)}` : "";
    fetch(`https://api.spotify.com/v1/me/player/pause${qs}`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}` },
      keepalive: true,
      priority: "high"
    }).catch(() => {});
  }

  async function resumePlaybackFast() {
    stopBuzzAudio();
    try {
      await withDeviceRetry(id =>
        spotifyFetch(`/me/player/play?device_id=${encodeURIComponent(id)}`, {
          method: "PUT",
          priority: "high"
        })
      );
    } catch (e) {}
  }

  async function generateDirectChoices(correctTrack, historyTracks) {
    const dummies = [];
    const usedNames = new Set([normalizeText(correctTrack.name)]);

    const collectFromSearch = async (query) => {
      try {
        const res = await spotifyFetch(`/search?q=${encodeURIComponent(query)}&type=track&limit=10`);
        const candidates = shuffle((res?.tracks?.items || []).map(toTrackObj).filter(Boolean));
        for (const c of candidates) {
          if (dummies.length >= 3) break;
          const norm = normalizeText(c.name);
          if (c.id !== correctTrack.id && !usedNames.has(norm)) {
            dummies.push(c);
            usedNames.add(norm);
          }
        }
      } catch (e) {}
    };

    if (correctTrack.firstArtist) await collectFromSearch(correctTrack.firstArtist);
    if (dummies.length < 3 && historyTracks.length > 0) {
      for (const h of shuffle(historyTracks)) {
        if (dummies.length >= 3) break;
        const norm = normalizeText(h.name);
        if (h.id !== correctTrack.id && !usedNames.has(norm)) {
          dummies.push(h);
          usedNames.add(norm);
        }
      }
    }
    if (dummies.length < 3) {
      const isJp = /[\u3040-\u30ff\u4e00-\u9faf]/.test(correctTrack.name + correctTrack.artist);
      await collectFromSearch(isJp ? "J-POP" : "Pop Hits");
    }
    return shuffle([correctTrack, ...dummies.slice(0, 3)]);
  }

  // ---------- ゲーム進行 ----------
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    unlockAudioAll();

    const playerCount = Number(document.getElementById("opt-players").value);
    const answerMode = document.getElementById("opt-mode").value;
    const scoringMode = document.getElementById("opt-scoring").value;
    const roundOpt = document.getElementById("opt-rounds").value;
    const leadMs = Number(document.getElementById("opt-lead").value);

    const baseState = {
      playerCount,
      mode: answerMode,
      scoringMode,
      leadMs,
      round: 0,
      roundToken: 0,
      scores: Array(playerCount).fill(0),
      state: "READY",
      lockedOut: new Set(),
      activePlayer: null,
      currentTrack: null,
      choicesPromise: null,
      playedIds: new Set(),
      directQueue: [],
      usedDirectTrackPlay: false,
      preparedTrack: null,
      preparedChoices: null,
      elapsedMs: 0,
      playingSince: null,
      buzzedMs: 0,
      buzzedPoints: 0
    };

    if (sourceMode === "direct") {
      if (!selectedDirectPlaylist) {
        alert("プレイリストを選択・検索・またはURL設定してください！");
        return;
      }
      game = {
        ...baseState,
        source: "direct",
        playlist: selectedDirectPlaylist,
        maxRounds: (roundOpt === "INF" || roundOpt === "ALL") ? Infinity : Number(roundOpt),
        historyTracks: [],
        directStarted: false
      };
    } else {
      const activeTracks = quizPool.filter(t => t.enabled);
      const minNeeded = answerMode === "choice" ? 4 : 1;
      if (activeTracks.length < minNeeded) {
        alert(`${answerMode === "choice" ? "4択モードでは最低4曲" : "最低1曲"}必要です！曲を追加してください。`);
        return;
      }
      const maxRounds = roundOpt === "INF"
        ? Infinity
        : (roundOpt === "ALL" ? activeTracks.length : Math.min(Number(roundOpt), activeTracks.length));
      game = {
        ...baseState,
        source: "custom",
        allTracks: activeTracks,
        deck: shuffle(activeTracks),
        deckCursor: 0,
        maxRounds
      };
    }

    showScreen("game");
    document.getElementById("cooldown-display").style.display = "none";
    document.getElementById("game-status").textContent = "準備ができたら下のスタートを押してください！";
    const playBtn = document.getElementById("btn-play");
    playBtn.textContent = "▶ 第1問をスタート！";
    playBtn.style.display = "inline-block";
    playBtn.disabled = false;
    updateTimerDisplay();
    renderGameUI();
  }

  function renderGameUI() {
    const totalLabel = game.maxRounds === Infinity ? "∞" : game.maxRounds;
    document.getElementById("round-label").textContent = `第 ${game.round + 1} / ${totalLabel} 問`;
    const topBox = document.getElementById("top-buzzers");
    const bottomBox = document.getElementById("bottom-buzzers");
    topBox.innerHTML = "";
    bottomBox.innerHTML = "";

    const makeBtn = (idx, rotated) => {
      const btn = document.createElement("button");
      btn.className = "buzzer-btn" + (rotated ? " rotated" : "") + (game.lockedOut.has(idx) ? " locked" : "");
      btn.style.background = PLAYER_COLORS[idx];
      btn.disabled = game.state !== "PLAYING" || game.lockedOut.has(idx);
      btn.innerHTML = `<span>${PLAYER_NAMES[idx]}</span><span class="buzzer-score">${game.scores[idx]} 点</span>`;
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        onBuzz(idx);
      });
      return btn;
    };

    if (game.playerCount === 1) {
      topBox.style.display = "none";
      bottomBox.className = "buzzer-row cols-1";
      bottomBox.appendChild(makeBtn(0, false));
    } else if (game.playerCount === 2) {
      topBox.style.display = "grid";
      topBox.className = "buzzer-row cols-1";
      bottomBox.className = "buzzer-row cols-1";
      topBox.appendChild(makeBtn(1, true));
      bottomBox.appendChild(makeBtn(0, false));
    } else if (game.playerCount === 3) {
      topBox.style.display = "grid";
      topBox.className = "buzzer-row cols-2";
      bottomBox.className = "buzzer-row cols-1";
      topBox.appendChild(makeBtn(1, true));
      topBox.appendChild(makeBtn(2, true));
      bottomBox.appendChild(makeBtn(0, false));
    } else {
      topBox.style.display = "grid";
      topBox.className = "buzzer-row cols-2";
      bottomBox.className = "buzzer-row cols-2";
      topBox.appendChild(makeBtn(1, true));
      topBox.appendChild(makeBtn(2, true));
      bottomBox.appendChild(makeBtn(0, false));
      bottomBox.appendChild(makeBtn(3, false));
    }

    const playBtn = document.getElementById("btn-play");
    playBtn.disabled = game.state !== "READY";
    if (game.state === "PLAYING" || game.state === "LOADING" || game.state === "COOLDOWN") {
      playBtn.style.display = "none";
    }
    document.getElementById("btn-giveup").disabled = game.state !== "PLAYING";
  }

  async function refillDirectQueue() {
    if (!game) return;
    try {
      const data = await spotifyFetch("/me/player/queue");
      const list = (data?.queue || []).map(toTrackObj).filter(Boolean);
      const queuedIds = new Set(game.directQueue.map(t => t.id));
      list.forEach(t => {
        if (!game.playedIds.has(t.id) && !queuedIds.has(t.id)) {
          game.directQueue.push(t);
          queuedIds.add(t.id);
        }
      });
      if (list.length > 0 && game.directQueue.length === 0) {
        game.playedIds.clear();
        list.forEach(t => {
          if (t.id !== game.currentTrack?.id) game.directQueue.push(t);
        });
      }
    } catch (e) {}
  }

  async function prepareNextQuestion(token) {
    if (!game || game.roundToken !== token) return;

    if (game.source === "custom") {
      if (game.deckCursor >= game.deck.length) {
        game.deck = shuffle(game.allTracks);
        game.deckCursor = 0;
      }
      const track = game.deck[game.deckCursor++];
      game.preparedTrack = track;
      if (game.mode === "choice") {
        const dummies = shuffle(game.allTracks.filter(t => t.id !== track.id)).slice(0, 3);
        game.preparedChoices = shuffle([track, ...dummies]);
      }
    } else {
      if (game.directQueue.length === 0 && !game.usedDirectTrackPlay) {
        await refillDirectQueue();
      }
      if (!game || game.roundToken !== token) return;

      let nextTrack = null;
      while (game.directQueue.length > 0) {
        const cand = game.directQueue.shift();
        if (!game.playedIds.has(cand.id)) {
          nextTrack = cand;
          break;
        }
      }
      if (!nextTrack) return;

      game.preparedTrack = nextTrack;
      if (game.mode === "choice") {
        const choices = await generateDirectChoices(nextTrack, game.historyTracks || []);
        if (!game || game.roundToken !== token) return;
        game.preparedChoices = choices;
      }
    }

    if (game && game.roundToken === token && game.state === "COOLDOWN") {
      document.getElementById("game-status").textContent = "✨ 準備OK！まもなくスタート！";
    }
  }

  // カウントダウン3秒固定 ＋ 残りleadMsでフライング再生（発音ラグを相殺）
  async function startCooldownAndPlay() {
    const token = ++game.roundToken;
    game.state = "COOLDOWN";
    game.elapsedMs = 0;
    game.playingSince = null;
    game.preparedTrack = null;
    game.preparedChoices = null;
    stopTimerLoop();
    updateTimerDisplay();
    renderGameUI();

    const cdEl = document.getElementById("cooldown-display");
    cdEl.style.display = "block";
    document.getElementById("game-status").textContent = "🎵 次の曲と選択肢を準備中...";

    const prepPromise = prepareNextQuestion(token).catch(() => {});

    // 3 → 2（2秒かけて裏で曲と4択を準備）
    for (let s = 3; s >= 2; s--) {
      if (!game || game.roundToken !== token) return;
      cdEl.textContent = String(s);
      playTone("tick");
      await sleep(1000);
    }

    if (!game || game.roundToken !== token) return;
    cdEl.textContent = "1";
    playTone("tick");

    // 最後の1秒でフライング再生を先打ち
    const leadMs = Math.min(950, Math.max(250, game.leadMs || 650));
    const preWait = Math.max(50, 1000 - leadMs);
    await sleep(preWait);
    if (!game || game.roundToken !== token) return;

    if (game.preparedTrack) {
      const track = game.preparedTrack;
      const choices = game.preparedChoices;
      game.preparedTrack = null;
      game.preparedChoices = null;

      game.currentTrack = track;
      game.playedIds.add(track.id);
      if (game.historyTracks) game.historyTracks.push(track);
      if (game.mode === "choice") {
        game.choicesPromise = choices
          ? Promise.resolve(choices)
          : generateDirectChoices(track, game.historyTracks || []);
      }
      if (game.source === "direct") game.usedDirectTrackPlay = true;

      try {
        const fireAt = Date.now();
        // 再生コマンド発射と同時に、最低限の発音待ち（leadMs）とAPI応答の長い方を待つ
        await Promise.all([
          playTrackFromZero(track.uri),
          sleep(leadMs)
        ]);
        if (!game || game.roundToken !== token) {
          pausePlaybackFast();
          return;
        }

        cdEl.style.display = "none";
        game.state = "PLAYING";
        game.elapsedMs = 0;
        game.playingSince = Date.now();
        document.getElementById("game-status").textContent = "🔥 再生中！早く押した人が勝ち！";
        renderGameUI();
        startTimerLoop();
        return;
      } catch (e) {
        if (!game || game.roundToken !== token) return;
        cdEl.style.display = "none";
        game.state = "READY";
        document.getElementById("game-status").textContent = "再生できませんでした（下から再試行）";
        const playBtn = document.getElementById("btn-play");
        playBtn.textContent = "▶ もう一度スタート";
        playBtn.style.display = "inline-block";
        playBtn.disabled = false;
        renderGameUI();
        alert(e.message);
        return;
      }
    }

    // 準備が間に合わなかった・キュー在庫切れ時は残り時間を待ってから通常ルートへ
    await sleep(leadMs);
    if (!game || game.roundToken !== token) return;
    await prepPromise;
    if (!game || game.roundToken !== token) return;
    cdEl.style.display = "none";
    playCurrentQuestion();
  }

  async function playCurrentQuestion() {
    unlockAudioAll();

    const token = ++game.roundToken;
    game.state = "LOADING";
    game.elapsedMs = 0;
    game.playingSince = null;
    stopTimerLoop();
    updateTimerDisplay();
    document.getElementById("cooldown-display").style.display = "none";
    renderGameUI();

    try {
      if (game.preparedTrack) {
        const track = game.preparedTrack;
        const choices = game.preparedChoices;
        game.preparedTrack = null;
        game.preparedChoices = null;

        game.currentTrack = track;
        game.playedIds.add(track.id);
        if (game.historyTracks) game.historyTracks.push(track);
        if (game.mode === "choice") {
          game.choicesPromise = choices
            ? Promise.resolve(choices)
            : generateDirectChoices(track, game.historyTracks || []);
        }
        if (game.source === "direct") game.usedDirectTrackPlay = true;

        await Promise.all([
          playTrackFromZero(track.uri),
          sleep(Math.min(500, game.leadMs || 500))
        ]);
        if (!game || game.roundToken !== token) return;

        game.state = "PLAYING";
        game.elapsedMs = 0;
        game.playingSince = Date.now();
        document.getElementById("game-status").textContent = "🔥 再生中！早く押した人が勝ち！";
        renderGameUI();
        startTimerLoop();
        return;
      }

      document.getElementById("game-status").textContent = "🎵 Spotifyで曲を準備中...";

      if (game.source === "direct") {
        let snap;
        if (!game.directStarted || game.usedDirectTrackPlay) {
          await refreshDeviceId();
          const beforeSnap = await getPlaybackSnapshot();
          await triggerDirectPlaylistStart(game.playlist);
          snap = await waitForTrackSwitch({
            beforeTrackId: beforeSnap?.trackId || null,
            beforeContextUri: beforeSnap?.contextUri || null,
            targetPlaylistId: game.playlist.id,
            isNext: false,
            roundToken: token
          });
          if (!game || game.roundToken !== token) return;
          game.directStarted = true;
          game.usedDirectTrackPlay = false;
        } else {
          const beforeTrackId = game.currentTrack?.id || (await getPlaybackSnapshot())?.trackId || null;
          await triggerDirectPlaylistNext();
          snap = await waitForTrackSwitch({
            beforeTrackId,
            beforeContextUri: null,
            targetPlaylistId: game.playlist.id,
            isNext: true,
            roundToken: token
          });
          if (!game || game.roundToken !== token) return;
        }

        if (!snap || !snap.track) throw new Error("曲情報を取得できませんでした。");

        game.currentTrack = snap.track;
        game.playedIds.add(snap.track.id);
        game.historyTracks.push(snap.track);
        if (game.mode === "choice") {
          game.choicesPromise = generateDirectChoices(snap.track, game.historyTracks);
        }

        game.state = "PLAYING";
        game.elapsedMs = (snap.progressMs >= 0 && snap.progressMs < 15000) ? snap.progressMs : 0;
        game.playingSince = Date.now();
        document.getElementById("game-status").textContent = "🔥 再生中！早く押した人が勝ち！";
        renderGameUI();
        startTimerLoop();

        setTimeout(() => {
          if (game && game.roundToken === token) refillDirectQueue();
        }, 700);
      } else {
        if (game.round === 0) await refreshDeviceId();
        if (game.deckCursor >= game.deck.length) {
          game.deck = shuffle(game.allTracks);
          game.deckCursor = 0;
        }
        const track = game.deck[game.deckCursor++];
        game.currentTrack = track;
        game.playedIds.add(track.id);

        if (game.mode === "choice") {
          const dummies = shuffle(game.allTracks.filter(t => t.id !== track.id)).slice(0, 3);
          game.choicesPromise = Promise.resolve(shuffle([track, ...dummies]));
        }

        await Promise.all([
          playTrackFromZero(track.uri),
          sleep(Math.min(500, game.leadMs || 500))
        ]);
        if (!game || game.roundToken !== token) return;

        game.state = "PLAYING";
        game.elapsedMs = 0;
        game.playingSince = Date.now();
        document.getElementById("game-status").textContent = "🔥 再生中！早く押した人が勝ち！";
        renderGameUI();
        startTimerLoop();
      }
    } catch (e) {
      if (!game || game.roundToken !== token) return;
      game.state = "READY";
      stopTimerLoop();
      document.getElementById("game-status").textContent = "再生できませんでした（下から再試行）";
      const playBtn = document.getElementById("btn-play");
      playBtn.textContent = "▶ もう一度スタート";
      playBtn.style.display = "inline-block";
      playBtn.disabled = false;
      renderGameUI();
      alert(e.message);
    }
  }

  function onBuzz(playerIdx) {
    if (!game || game.state !== "PLAYING" || game.lockedOut.has(playerIdx)) return;

    // 1. 最速でSpotify停止命令を発射 ＋ 同時にChromeのAudio再生でOSレベル割り込み
    pausePlaybackFast();
    triggerInstantBuzzSound();

    const lockedMs = getElapsedMs();
    game.elapsedMs = lockedMs;
    game.playingSince = null;
    game.buzzedMs = lockedMs;
    game.buzzedPoints = calcPointsForElapsed(lockedMs, game.scoringMode);
    game.state = "ANSWERING";
    game.activePlayer = playerIdx;

    stopTimerLoop();
    updateTimerDisplay();
    renderGameUI();
    openAnswerModal(playerIdx);
  }

  async function openAnswerModal(playerIdx) {
    const titleEl = document.getElementById("ans-player-title");
    titleEl.textContent = `${PLAYER_NAMES[playerIdx]} の回答権！`;
    titleEl.style.color = PLAYER_COLORS[playerIdx];

    const secStr = (game.buzzedMs / 1000).toFixed(2);
    document.getElementById("ans-time-badge").textContent =
      game.scoringMode === "speed"
        ? `⏱ ${secStr} 秒！（正解で +${game.buzzedPoints} 点）`
        : `⏱ ${secStr} 秒！（正解で +1 点）`;

    const choiceArea = document.getElementById("ans-choice-area");
    const textArea = document.getElementById("ans-text-area");
    document.getElementById("modal-answer").classList.add("active");

    const track = game.currentTrack;

    if (game.mode === "choice") {
      choiceArea.style.display = "block";
      textArea.style.display = "none";
      choiceArea.innerHTML = `<div class="hint" style="padding:16px 0;">選択肢を準備中...</div>`;

      if (!track) {
        choiceArea.innerHTML = `<div class="hint" style="color:var(--accent-dark);">曲情報の取得に失敗しました。パスしてください。</div>`;
        return;
      }
      if (!game.choicesPromise) {
        game.choicesPromise = generateDirectChoices(track, game.historyTracks || []);
      }
      const options = await game.choicesPromise;
      choiceArea.innerHTML = "";
      options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerHTML = `
          <span class="choice-letter" style="background:${CHOICE_COLORS[i]};">${CHOICE_LETTERS[i]}</span>
          <span style="flex:1; min-width:0;">
            <span style="display:block; font-weight:900;">${escapeHtml(opt.name)}</span>
            <span class="choice-sub">${escapeHtml(opt.artist)}</span>
          </span>
        `;
        btn.onclick = () => judgeAnswer(opt.id === track.id);
        choiceArea.appendChild(btn);
      });
    } else {
      choiceArea.style.display = "none";
      textArea.style.display = "block";
      const input = document.getElementById("ans-text-input");
      const submitBtn = document.getElementById("btn-text-submit");
      input.value = "";
      submitBtn.disabled = !track;
      setTimeout(() => input.focus(), 80);
    }
  }

  function normalizeText(str) {
    return str
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
      .replace(/[()（）【】\[\]「」『』・\-~!！?？'".,、。\s]/g, "");
    }
  function stripSubtitle(str) {
    return str
      .replace(/\s*[\(（\[【].*?[\)）\]】]/g, "")
      .replace(/\s*[-–—]\s*(remaster|live|acoustic|ver|version|edit|feat|ft).*$/i, "");
  }

  function submitTextAnswer() {
    const raw = document.getElementById("ans-text-input").value.trim();
    if (!raw || !game.currentTrack) return;
    const track = game.currentTrack;
    const userNorm = normalizeText(raw);
    const fullNorm = normalizeText(track.name);
    const shortNorm = normalizeText(stripSubtitle(track.name));
    judgeAnswer(userNorm.length > 0 && (userNorm === fullNorm || userNorm === shortNorm));
  }

  async function judgeAnswer(isCorrect) {
    document.getElementById("modal-answer").classList.remove("active");
    if (isCorrect) {
      playTone("correct");
      const pts = game.buzzedPoints;
      const secStr = (game.buzzedMs / 1000).toFixed(2);
      game.scores[game.activePlayer] += pts;
      showReveal(
        `🎉 ${PLAYER_NAMES[game.activePlayer]} 正解！`,
        `⏱ ${secStr} 秒　/　+${pts} 点ゲット！`
      );
    } else {
      playTone("wrong");
      game.lockedOut.add(game.activePlayer);
      if (game.lockedOut.size >= game.playerCount) {
        showReveal("💥 全員お手つき！正解はこちら", null);
      } else {
        document.getElementById("game-status").textContent =
          `💦 ${PLAYER_NAMES[game.activePlayer]} 不正解！曲を再開します`;
        await resumePlaybackFast();
        game.state = "PLAYING";
        game.playingSince = Date.now();
        renderGameUI();
        startTimerLoop();
      }
    }
  }

  function giveUpQuestion() {
    pausePlaybackFast();
    stopTimerLoop();
    game.playingSince = null;
    showReveal("⏭ 正解はこちら！", null);
  }

  function showReveal(heading, speedText) {
    game.state = "REVEAL";
    stopTimerLoop();
    const track = game.currentTrack;
    document.getElementById("reveal-heading").textContent = heading;
    const badge = document.getElementById("reveal-speed-badge");
    if (speedText) {
      badge.textContent = speedText;
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
    document.getElementById("reveal-img").src = track?.image || "";
    document.getElementById("reveal-title").textContent = track?.name || "（曲情報を取得できませんでした）";
    document.getElementById("reveal-artist").textContent = track?.artist || "";
    document.getElementById("modal-reveal").classList.add("active");
    renderGameUI();
  }

  function nextRound() {
    document.getElementById("modal-reveal").classList.remove("active");
    game.round++;
    if (game.round >= game.maxRounds) {
      finishGame();
      return;
    }
    game.lockedOut = new Set();
    game.activePlayer = null;
    game.elapsedMs = 0;
    game.playingSince = null;
    updateTimerDisplay();
    startCooldownAndPlay();
  }

  function finishOrAbortGame() {
    if (confirm("現在の得点でゲームを終了して結果発表へ進みますか？")) {
      finishGame();
    }
  }

  function finishGame() {
    if (game) game.roundToken++;
    pausePlaybackFast();
    stopBuzzAudio();
    stopTimerLoop();
    document.getElementById("cooldown-display").style.display = "none";
    document.getElementById("modal-answer").classList.remove("active");
    document.getElementById("modal-reveal").classList.remove("active");
    const medals = ["👑", "🥈", "🥉", "🎵"];
    const ranked = game.scores
      .map((score, idx) => ({ name: PLAYER_NAMES[idx], color: PLAYER_COLORS[idx], score }))
      .sort((a, b) => b.score - a.score);
    document.getElementById("final-ranking").innerHTML = ranked
      .map((r, i) => `
        <div class="rank-row" style="border-left:10px solid ${r.color};">
          <span>${medals[i] || "🎵"} ${i + 1}位　${r.name}</span>
          <span style="font-size:20px; color:${r.color};">${r.score} 点</span>
        </div>
      `).join("");
    showScreen("finish");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }

  init();
</script>

</html>
